<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hero Lab — FrontPage Labs</title>
<style>
  :root{
    --ink:#01194b; --ink-deep:#010f2e; --cyan:#03f6ff; --wolf:#7584a2;
    --panel-w:420px; --line:rgba(255,255,255,.10); --dim:rgba(255,255,255,.55);
    --frame-w:1440px; --frame-h:900px; --frame-scale:1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:#fff;overflow:hidden;
    font:400 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(3,246,255,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(117,132,162,.16), transparent 55%),
      var(--ink-deep)}

  /* ── Top bar ─────────────────────────────────────────────── */
  .topbar{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;
    background:rgba(1,25,75,.7);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .brand b{font-size:14px;font-weight:700;letter-spacing:-.02em}
  .brand span{font-size:11px;color:var(--dim)}
  .pills{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{position:relative;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:12px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .12s ease;touch-action:manipulation}
  .pill:hover{background:rgba(255,255,255,.12)}
  .pill:active{transform:scale(.96)}
  .pill.on{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
  .pill .id{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:rgba(255,255,255,.12);font-weight:700;font-size:11px}
  .pill.on .id{background:rgba(1,25,75,.22)}
  .pill .kill{margin-left:2px;opacity:.45;font-size:13px;line-height:1}
  .pill .kill:hover{opacity:1;color:#ff8f8f}
  .pill.add{border-style:dashed;color:var(--dim)}
  .spacer{flex:1}
  .tbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s ease,transform .12s ease;
    touch-action:manipulation}
  .tbtn:hover{background:rgba(255,255,255,.12)}
  .tbtn:active{transform:scale(.96)}
  .tbtn.on{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
  .pill:focus-visible,.tbtn:focus-visible,.fbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .lan{font-size:11px;color:var(--dim);white-space:nowrap}
  .lan b{color:var(--cyan);font-weight:600}

  /* ── Stage ───────────────────────────────────────────────── */
  .main{display:flex;height:calc(100% - 56px)}
  .stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:22px 20px 76px}
  .wrap{position:relative;flex:0 0 auto;
    width:calc(var(--frame-w) * var(--frame-scale));
    height:calc(var(--frame-h) * var(--frame-scale))}
  .screen{position:relative;width:var(--frame-w);height:var(--frame-h);overflow:hidden;background:#fff;
    transform:scale(var(--frame-scale));transform-origin:0 0;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .screen iframe{display:block;border:0;width:100%;height:100%;background:#fff}
  body.phone .wrap{padding:10px;border-radius:34px;background:linear-gradient(180deg,#1b2c4e,#0c1a38);
    width:calc(var(--frame-w) * var(--frame-scale) + 20px);
    height:calc(var(--frame-h) * var(--frame-scale) + 20px);
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.06) inset}
  body.phone .screen{border-radius:26px}
  .foldline{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(3,246,255,.9);z-index:6;
    pointer-events:none;display:none}
  .foldline::after{content:'fold';position:absolute;right:6px;top:-9px;font:700 9px sans-serif;color:var(--ink);
    background:var(--cyan);border-radius:4px;padding:1px 5px;letter-spacing:.04em}
  .foldline.show{display:block}
  .stagebar{position:fixed;left:calc((100vw - var(--panel-w))/2);transform:translateX(-50%);bottom:14px;
    display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(1,25,75,.9);
    border:1px solid var(--line);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:20;
    font-size:11px;color:var(--dim);white-space:nowrap}
  .stagebar select,.stagebar input[type=number]{background:rgba(255,255,255,.08);border:1px solid var(--line);
    border-radius:6px;color:#fff;font-size:12px;padding:4px 6px}
  .stagebar select option{color:#111}
  .stagebar input[type=range]{width:90px;accent-color:var(--cyan)}
  .stagebar input[type=number]{width:60px}
  .flipbtn.holding{background:#fff;color:var(--ink);border-color:#fff}
  .pagechip{font-size:11px;color:var(--dim);margin:0 0 10px;letter-spacing:.02em}
  .pagechip b{color:var(--cyan);font-weight:600}

  /* compare mode */
  .cmp{flex:1;display:none;flex-wrap:wrap;gap:18px;overflow:auto;padding:24px;align-content:flex-start}
  body.compare .cmp{display:flex}
  body.compare .stage{display:none}
  .cmp-head{display:flex;align-items:center;gap:8px;margin:0 0 8px 2px;font-size:12px;font-weight:600}
  .cmp-head .id{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    background:var(--cyan);color:var(--ink);font-weight:700;font-size:11px}
  .cmp-frame{width:calc(var(--frame-w) * .3);height:calc(var(--frame-h) * .3);overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.5);background:#fff}
  .cmp-frame iframe{border:0;width:var(--frame-w);height:var(--frame-h);transform:scale(.3);transform-origin:0 0;
    pointer-events:none}

  /* ── Panel ───────────────────────────────────────────────── */
  .panel{width:var(--panel-w);flex:0 0 var(--panel-w);display:flex;flex-direction:column;
    background:rgba(1,20,58,.94);border-left:1px solid var(--line);backdrop-filter:blur(10px)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
  .panel-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .panel-head a{font-size:11px;color:var(--cyan);white-space:nowrap;text-decoration:none}
  .panel-head a:hover{text-decoration:underline}
  .panel-body{flex:1;overflow-y:auto;padding:0 16px 16px}
  .locknote{margin:4px 0 14px;padding:10px 12px;border-radius:10px;background:rgba(3,246,255,.08);
    border:1px solid rgba(3,246,255,.3);font-size:12px;line-height:1.55;color:#c8f7fb}
  .sec{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:rgba(255,255,255,.03)}
  .sec summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none;
    font-size:12px;font-weight:700;letter-spacing:.02em;user-select:none}
  .sec summary::-webkit-details-marker{display:none}
  .sec summary::before{content:'▸';font-size:10px;color:var(--dim);transition:transform .15s ease}
  .sec[open] summary::before{transform:rotate(90deg)}
  .dirty-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-left:auto;
    box-shadow:0 0 8px rgba(3,246,255,.8)}
  .sec-in{padding:2px 12px 12px}
  .ctl{margin:0 0 12px}
  .ctl:last-child{margin-bottom:2px}
  .ctl label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:10px;font-weight:700;
    color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:0 0 5px}
  .ctl label .count{font-weight:400;text-transform:none;letter-spacing:0}
  .ctl label .lright{display:flex;align-items:center;gap:8px}
  .fmtbar{display:inline-flex;gap:4px}
  .fmt{width:22px;height:20px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.06);
    color:#fff;font-size:11px;cursor:pointer;line-height:1;padding:0;touch-action:manipulation}
  .fmt:hover{background:rgba(3,246,255,.3);border-color:var(--cyan)}
  .fmt.blue{color:var(--cyan)}
  input[type=text],textarea,select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:8px;color:#fff;font:400 13px/1.5 inherit;padding:8px 10px}
  textarea{resize:vertical;min-height:54px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(3,246,255,.16)}
  input:disabled,textarea:disabled,select:disabled{opacity:.45;cursor:not-allowed}
  select option{color:#111}
  .row{display:flex;align-items:center;gap:6px;margin:0 0 6px}
  .row .num{width:62px;flex:none}
  .row.sub{margin:-2px 0 10px;padding-left:2px}
  .row.sub .href{font-size:12px;padding:5px 8px;color:var(--dim)}
  .row.sub .href:focus{color:#fff}
  .row .del{width:26px;height:26px;flex:none;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--dim);font-size:12px;cursor:pointer;line-height:1}
  .row .del:hover{background:rgba(255,90,90,.2);color:#ffc9c9}
  .addrow{width:100%;margin-top:2px}
  .slider-row{display:flex;align-items:center;gap:10px}
  .slider-row input[type=range]{flex:1;accent-color:var(--cyan)}
  .slider-row .val{min-width:70px;text-align:right;font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums}
  .slider-row .clr{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:transparent;
    color:var(--dim);font-size:11px;cursor:pointer;line-height:1}
  .slider-row .clr:hover{background:rgba(255,255,255,.1);color:#fff}
  .check{display:flex;align-items:center;gap:8px;font-size:12px;color:#fff;cursor:pointer}
  .check input{width:auto;accent-color:var(--cyan)}
  .hint{font-size:11px;color:var(--dim);line-height:1.5;margin:4px 0 0}
  .warns{margin:2px 0 12px;display:flex;flex-direction:column;gap:6px}
  .warn{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.45;
    background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.4);color:#ffc9c9}
  .warn.ok{background:rgba(80,200,120,.10);border-color:rgba(80,200,120,.35);color:#bdf0cf}

  .panel-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .fbtn{flex:1 1 auto;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .12s ease,transform .12s ease;touch-action:manipulation}
  .fbtn:hover{background:rgba(255,255,255,.14)}
  .fbtn:active{transform:scale(.97)}
  .fbtn.primary{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
  .fbtn.primary:hover{background:#6bf9ff}
  .fbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:99;background:#fff;
    color:var(--ink);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;
    box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),opacity .25s ease;
    pointer-events:none;max-width:60vw}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .boot-err{margin:40px auto;max-width:520px;padding:20px;border-radius:12px;background:rgba(255,90,90,.12);
    border:1px solid rgba(255,90,90,.4);font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>Hero&nbsp;Lab</b><span>real pages</span></div>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <button class="tbtn flipbtn" id="flip" title="Hold to see the home-page baseline (or hold Space)">⇄ Hold: baseline</button>
  <button class="tbtn" id="cmpbtn">▦ Compare</button>
  <span class="lan" id="lan"></span>
</div>

<div class="main">
  <div class="stage" id="stage">
    <div class="pagechip" id="pagechip"></div>
    <div class="wrap" id="wrap">
      <div class="screen">
        <iframe id="frame" title="page preview"></iframe>
      </div>
      <div class="foldline" id="foldline"></div>
    </div>
    <div class="stagebar">
      <select id="devsel" title="Viewport preset">
        <option value="1440x900" selected>Desktop · 1440×900</option>
        <option value="1280x800">Laptop · 1280×800</option>
        <option value="834x1112">iPad · 834×1112</option>
        <option value="430x932">iPhone Pro Max · 430×932</option>
        <option value="390x844">iPhone 13–15 · 390×844</option>
        <option value="360x780">Galaxy S24 · 360×780</option>
        <option value="custom">Custom…</option>
      </select>
      <input type="number" id="fw" min="320" max="1920" step="10" title="viewport width (px)">
      <span>×</span>
      <input type="number" id="fh" min="500" max="1400" step="10" title="viewport height (px)">
      <span style="opacity:.3">|</span>
      <label class="check"><input type="checkbox" id="foldck"> fold</label>
      <button class="tbtn" id="reloadb" title="Reload the frame from the server" style="height:28px;padding:0 10px">↻</button>
    </div>
  </div>
  <div class="cmp" id="cmp"></div>

  <aside class="panel">
    <div class="panel-head"><h2 id="ptitle">Page</h2><a id="openpage" href="#" target="_blank" rel="noopener"></a></div>
    <div class="panel-body" id="pbody"></div>
    <div class="panel-foot">
      <button class="fbtn" id="undob" title="Cmd/Ctrl+Z">↩ Undo</button>
      <button class="fbtn" id="resetb">Reset page</button>
      <button class="fbtn" id="shotb" title="Needs puppeteer installed">📸</button>
      <button class="fbtn" id="copyb">Copy JSON</button>
      <button class="fbtn primary" id="saveb" title="Cmd/Ctrl+S">💾 Save &amp; build</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>
<script src="/injector.js"></script>
<script>
'use strict';

/* ══ State ═══════════════════════════════════════════════════
   `baseline` is the LIVE HOME PAGE hero (fetched and parsed, never the page
   in the frame). That matters: a variant stores deltas from home, so
   comparing an edit against the landing page it is already rendered into
   would make every retyped value look like "inherit". */
let state = { variants: [], activeId: null };
let baseline = null;
let defaults = { offer: {}, meta: {} };
let meta = { pages: [], projects: [], lan: null };
let undoStack = [], undoArmed = null;
let frameReady = false;

const HERO_KEYS = FplHeroLab.HERO_KEYS;
const OFFER_KEYS = FplHeroLab.OFFER_KEYS;
const EDIT_KEYS = FplHeroLab.EDIT_KEYS;
const META_KEYS = ['title', 'metaDescription', 'indexable'];
const secOpen = { page:true, headline:true, index:false, proof:false, cta:false, media:false, sizing:false,
                  offer:true, showcase:false, close:false };

const $ = (id) => document.getElementById(id);
const frame = $('frame');
const norm = (s) => FplHeroLab.norm(s);
const plain = (s) => FplHeroLab.mdPlain(s);
const active = () => state.variants.find((v) => v.id === state.activeId);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone = (v) => JSON.parse(JSON.stringify(v));

function kebab(s) {
  return norm(s).toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'').slice(0, 48) || 'page';
}
function mergedActive() { return FplHeroLab.merged(active() || {}, baseline); }

/** The URL the frame should show for a variant: its own page once saved,
 *  otherwise the home page (same hero DOM, so edits still preview).
 *  `/__home/` because the lab itself owns `/` on this server. */
function targetUrl(v) {
  if (!v || v.locked || !v.slug) return '/__home/';
  return meta.pages.includes(v.slug) ? '/lp/' + v.slug + '/' : '/__home/';
}
/** Same page on the Astro dev server — for opening in a real tab. */
function realUrl(v) {
  const base = meta.astroUrl || 'http://localhost:4321';
  return base + (!v || v.locked || !v.slug ? '/' : '/lp/' + v.slug + '/');
}
const isDraft = (v) => !!v && !v.locked && !meta.pages.includes(v.slug);

function newVariant(from) {
  const used = new Set(state.variants.map((v) => v.id));
  let code = 'a'.charCodeAt(0);
  while (used.has(String.fromCharCode(code))) code++;
  const id = String.fromCharCode(code);
  const v = from ? clone(from) : {};
  EDIT_KEYS.concat(META_KEYS).forEach((k) => { if (!(k in v)) v[k] = null; });
  Object.assign(v, { id, name: 'New page', slug: 'new-page-' + id, slugAuto: true, locked: false, description: '' });
  return v;
}

/* ══ Boot ════════════════════════════════════════════════════ */
async function boot() {
  try { defaults = await (await fetch('/data/defaults.json', { cache: 'no-store' })).json(); } catch {}
  try { meta = await (await fetch('/meta')).json(); } catch {}
  if (meta.lan) $('lan').innerHTML = 'phone: <b>' + esc(meta.lan.replace('http://','')) + '/preview/&lt;id&gt;</b>';
  try {
    const saved = await (await fetch('/data/variants.json', { cache: 'no-store' })).json();
    if (Array.isArray(saved.variants) && saved.variants.length) state = saved;
  } catch {}

  // Baseline = the live home page, parsed out of band.
  try {
    const doc = new DOMParser().parseFromString(await (await fetch('/__home/', { cache: 'no-store' })).text(), 'text/html');
    if (!doc.querySelector('[data-fpl-hero]')) throw new Error('no [data-fpl-hero] on the home page');
    baseline = Object.assign(FplHeroLab.capture(doc), defaults.offer);
  } catch (e) {
    $('pbody').innerHTML = '<div class="boot-err">Could not read the home page hero.<br>' + esc(e.message) +
      '<br><br>Is the Astro dev server up, and does <code>src/components/LandingHero.astro</code> still carry its <code>data-fpl-*</code> attributes?</div>';
    return;
  }

  if (!state.variants.length) {
    const home = newVariant(null);
    Object.assign(home, { id:'a', name:'A — Home page (live)', slug:'', locked:true,
      description:'The live home page hero. Locked — the baseline every landing page inherits from.' });
    state = { variants: [home], activeId: 'a' };
  }
  if (!active()) state.activeId = state.variants[0].id;

  frame.addEventListener('load', onFrameLoad);
  setFrame(1440, 900);
  loadFrame();
  renderPills();
  renderPanel();
}

function loadFrame() {
  frameReady = false;
  const url = targetUrl(active());
  if (frame.getAttribute('src') === url) { frame.contentWindow.location.reload(); }
  else frame.src = url;
  const v = active();
  $('pagechip').innerHTML = isDraft(v)
    ? 'previewing on the <b>home page</b> shell — Save to build <b>/lp/' + esc(v.slug) + '</b>'
    : 'live page: <b>' + esc(url) + '</b>';
}

function onFrameLoad() {
  const doc = frame.contentDocument;
  if (!doc || !doc.querySelector('[data-fpl-hero]')) return;
  frameReady = true;
  applyToFrame();
}

/* ══ Apply + guardrails ══════════════════════════════════════ */
function applyToFrame(override) {
  if (!frameReady || !baseline) return;
  FplHeroLab.apply(frame.contentDocument, override || mergedActive(), baseline);
  requestAnimationFrame(measureGuardrails);
}

function lineCount(el) {
  if (!el) return 0;
  const lh = parseFloat(frame.contentWindow.getComputedStyle(el).lineHeight);
  if (!lh) return 0;
  return Math.round(el.getBoundingClientRect().height / lh);
}

function measureGuardrails() {
  const box = $('warns');
  if (!box || !frameReady) return;
  const doc = frame.contentDocument;
  const m = mergedActive();
  const warns = [];

  const heads = [...doc.querySelectorAll('[data-fpl-hero] .hero-heading')];
  heads.forEach((h, i) => {
    if (h.scrollWidth > h.clientWidth + 1)
      warns.push('Headline line ' + (i + 1) + ' overflows the viewport at ' + $('fw').value + 'px — shorten it or drop the headline size.');
    if (lineCount(h) > 1)
      warns.push('Headline line ' + (i + 1) + ' wraps — the display type is meant to hold one line.');
  });

  const cta = doc.querySelector('[data-fpl-hero] .hero-cta');
  if (cta) {
    const bottom = cta.getBoundingClientRect().bottom;
    const fold = frame.clientHeight;
    if (bottom > fold) warns.push('The CTA sits ' + Math.round(bottom - fold) + 'px below the fold at this viewport.');
  }

  const stats = m.statLines || [];
  if (stats.length > 4) warns.push(stats.length + ' proof lines — the column is designed for three.');
  const longest = stats.concat([m.kicker || '']).reduce((a, s) => Math.max(a, plain(s).length), 0);
  if (longest > 90) warns.push('A proof line runs ' + longest + ' characters — they read best under ~70.');

  if ((m.listItems || []).length > 6) warns.push((m.listItems || []).length + ' index rows — over six starts to crowd the hero.');

  const v = active();
  if (v && !v.locked && !norm(m.price)) warns.push('No price set — the price block is hidden on this page.');

  box.innerHTML = warns.length
    ? warns.map((w) => '<div class="warn">⚠ <span>' + esc(w) + '</span></div>').join('')
    : '<div class="warn ok">✓ Headline fits, CTA is above the fold, proof lines read clean.</div>';
}

/* ══ Variant pills ═══════════════════════════════════════════ */
function renderPills() {
  const el = $('pills');
  el.innerHTML = '';
  state.variants.forEach((v) => {
    const b = document.createElement('button');
    b.className = 'pill' + (v.id === state.activeId ? ' on' : '');
    b.innerHTML = '<span class="id">' + esc(v.id.toUpperCase()) + '</span>' +
      (v.locked ? '<span>🔒</span>' : '') +
      '<span>' + esc(v.name.replace(/^[A-Za-z]\s*[—–-]\s*/, '').slice(0, 24)) + '</span>';
    b.title = v.name + (v.description ? ' — ' + v.description : '');
    b.onclick = () => { state.activeId = v.id; loadFrame(); renderPills(); renderPanel(); };
    if (!v.locked) {
      const kill = document.createElement('span');
      kill.className = 'kill';
      kill.textContent = '✕';
      kill.title = 'Delete this page';
      kill.onclick = (e) => { e.stopPropagation(); removeVariant(v); };
      b.appendChild(kill);
    }
    el.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'pill add';
  add.textContent = '＋ New page';
  add.title = 'Duplicates the page you are on';
  add.onclick = async () => {
    arm();
    const v = newVariant(active());
    state.variants.push(v);
    state.activeId = v.id;
    commit();
    renderPills(); renderPanel();
    await save({ quiet: true });
    loadFrame();
    toast('New page ' + v.id.toUpperCase() + ' — /lp/' + v.slug);
  };
  el.appendChild(add);
}

async function removeVariant(v) {
  if (!confirm('Delete “' + v.name + '”?\n\nThe page at /lp/' + v.slug + ' stops being built.')) return;
  arm();
  state.variants = state.variants.filter((x) => x.id !== v.id);
  if (!active()) state.activeId = state.variants[0].id;
  commit();
  await save({ quiet: true });
  loadFrame(); renderPills(); renderPanel();
  toast('Deleted ' + v.name);
}

/* ══ Panel ═══════════════════════════════════════════════════ */
function dirty(k) { const v = active(); return !!v && !v.locked && v[k] !== null && v[k] !== undefined; }
function dirtyAny(keys) { return keys.some(dirty); }

function sec(id, label, isDirty, inner) {
  return '<details class="sec"' + (secOpen[id] ? ' open' : '') + ' data-sec="' + id + '">' +
    '<summary>' + label + (isDirty ? '<span class="dirty-dot"></span>' : '') + '</summary>' +
    '<div class="sec-in">' + inner + '</div></details>';
}

/** A plain text/textarea bound to one field. `raw` fields (name, slug, meta)
 *  are stored verbatim; everything else goes through the delta rule. */
function textRow(key, label, o) {
  o = o || {};
  const v = active(), m = mergedActive();
  const val = v[key] !== null && v[key] !== undefined ? v[key] : (o.raw ? '' : m[key]);
  const count = o.count ? '<span class="count" id="cnt-' + key + '">' + plain(val).length + '</span>' : '';
  const dis = v.locked && !o.always ? ' disabled' : '';
  const fmt = o.rich && !v.locked
    ? '<span class="fmtbar">' +
      '<button class="fmt" data-fmt="**" data-for="' + key + '" title="Bold"><b>B</b></button>' +
      '<button class="fmt" data-fmt="*" data-for="' + key + '" title="Italic"><i>I</i></button>' +
      '<button class="fmt blue" data-fmt="~" data-for="' + key + '" title="Cyan accent">◆</button></span>'
    : '';
  const body = o.area
    ? '<textarea data-k="' + key + '"' + dis + (o.rows ? ' rows="' + o.rows + '"' : '') + '>' + esc(val) + '</textarea>'
    : '<input type="text" data-k="' + key + '" value="' + esc(val) + '"' + dis + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>';
  return '<div class="ctl"><label>' + label + '<span class="lright">' + fmt + count + '</span></label>' +
    body + (o.hint ? '<p class="hint">' + o.hint + '</p>' : '') + '</div>';
}

function sliderRow(key, label, min, max, step, unit) {
  const v = active(), set = v[key] !== null && v[key] !== undefined;
  const val = set ? v[key] : (min + max) / 2;
  const dis = v.locked ? ' disabled' : '';
  return '<div class="ctl"><label>' + label + '</label><div class="slider-row">' +
    '<input type="range" data-slider="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"' + dis + '>' +
    '<span class="val" id="val-' + key + '">' + (set ? v[key] + unit : 'stylesheet') + '</span>' +
    '<button class="clr" data-clear="' + key + '" title="Back to the stylesheet"' + dis + '>✕</button></div></div>';
}

/** Repeatable rows. `cols` is either a single text column or the
 *  label/number pair the hero index uses. */
function listRows(key, label, cols, opts) {
  opts = opts || {};
  const v = active(), m = mergedActive();
  const rows = m[key] || [];
  const dis = v.locked ? ' disabled' : '';
  let h = '<div class="ctl"><label>' + label +
    '<span class="lright"><span class="count">' + rows.length + '</span>' +
    (dirty(key) ? '<button class="fmt" data-clear="' + key + '" title="Back to the baseline list">↺</button>' : '') +
    '</span></label>';
  rows.forEach((row, i) => {
    h += '<div class="row">';
    if (cols === 'pair') {
      h += '<input type="text" data-list="' + key + '" data-i="' + i + '" data-sub="label" value="' + esc(row.label) + '"' + dis + '>' +
        '<input type="text" class="num" data-list="' + key + '" data-i="' + i + '" data-sub="number" value="' + esc(row.number) + '"' + dis + '>';
    } else if (cols === 'project') {
      h += '<select data-list="' + key + '" data-i="' + i + '"' + dis + '>' +
        (meta.projects.includes(row) ? '' : '<option value="' + esc(row) + '" selected>' + esc(row) + ' (not in projects.ts)</option>') +
        meta.projects.map((p) => '<option value="' + esc(p) + '"' + (p === row ? ' selected' : '') + '>' + esc(p) + '</option>').join('') +
        '</select>';
    } else {
      h += '<input type="text" data-list="' + key + '" data-i="' + i + '" value="' + esc(row) + '"' + dis + '>';
    }
    h += '<button class="del" data-del="' + key + '" data-i="' + i + '"' + dis + '>✕</button></div>';
    // The hero index rows can link somewhere; the link gets its own line so
    // the label doesn't get squeezed into a third of the panel.
    if (cols === 'pair') {
      h += '<div class="row sub"><input type="text" class="href" data-list="' + key + '" data-i="' + i +
        '" data-sub="href" value="' + esc(row.href || '') + '" placeholder="/services#websites — optional link"' + dis + '></div>';
    }
  });
  h += '<button class="tbtn addrow" data-add="' + key + '"' + dis + '>＋ Add</button>' +
    (opts.hint ? '<p class="hint">' + opts.hint + '</p>' : '') + '</div>';
  return h;
}

function renderPanel() {
  const v = active();
  if (!v || !baseline) return;
  $('ptitle').textContent = v.name;
  $('openpage').textContent = isDraft(v) ? 'unsaved — save to build it' : (v.locked ? '/' : '/lp/' + v.slug) + ' ↗';
  $('openpage').href = realUrl(v);

  let h = '';
  if (v.locked) {
    h += '<div class="locknote">🔒 <b>Home page.</b> This is the live hero, read-only, because it is the baseline ' +
      'every landing page inherits from. Edit it in <code>src/data/hero.ts</code>; use ＋ New page to start a landing page from it.</div>';
  }
  h += '<div class="warns" id="warns"></div>';

  h += sec('page', 'Page', false,
    textRow('name', 'Name', { raw: true, always: false }) +
    (v.locked ? '' :
      '<div class="ctl"><label>Slug <span class="count">/lp/…</span></label>' +
      '<input type="text" data-k="slug" value="' + esc(v.slug || '') + '">' +
      '<p class="hint">The URL. Renaming it builds a new page and drops the old one on the next save.</p></div>') +
    textRow('description', 'Note to self', { raw: true, area: true, rows: 2,
      hint: 'Why this page exists — the angle, the campaign it is for.' }) +
    (v.locked ? '' :
      textRow('title', 'Browser title', { raw: true }) +
      textRow('metaDescription', 'Meta description', { raw: true, area: true, rows: 2 }) +
      '<label class="check"><input type="checkbox" data-check="indexable"' + (v.indexable ? ' checked' : '') + '> ' +
      'Let search engines index this page</label>' +
      '<p class="hint">Off by default — ad landing pages usually should not compete with the main site in search.</p>'));

  h += sec('headline', 'Headline', dirtyAny(['headlineTop','headlineBottom','headlineAlign']),
    textRow('headlineTop', 'Line 1', { count: true, rich: true }) +
    textRow('headlineBottom', 'Line 2', { count: true, rich: true,
      hint: 'Display type at 14vw — roughly nine characters per line before it overflows.' }) +
    '<div class="ctl"><label>Alignment</label><select data-k="headlineAlign"' + (v.locked ? ' disabled' : '') + '>' +
      [['split','Split — line 2 to the right'],['left','Stacked left']].map(([val, lab]) =>
        '<option value="' + val + '"' + (mergedActive().headlineAlign === val ? ' selected' : '') + '>' + lab + '</option>').join('') +
      '</select></div>');

  h += sec('index', 'Hero index', dirtyAny(['eyebrow','listItems']),
    textRow('eyebrow', 'Eyebrow') +
    listRows('listItems', 'Rows', 'pair', { hint: 'Label and its number, e.g. “Landing page · 01”.' }));

  h += sec('proof', 'Proof lines', dirtyAny(['statLines','kicker']),
    listRows('statLines', 'Lines', 'text', { hint: '**bold** the number, plain text after it.' }) +
    textRow('kicker', 'Kicker', { rich: true, count: true }));

  h += sec('cta', 'Call to action', dirtyAny(['ctaText','ctaLabel','ctaHref']),
    textRow('ctaText', 'Line above the button', { rich: true }) +
    textRow('ctaLabel', 'Button label', { count: true }) +
    textRow('ctaHref', 'Button link') +
    '<p class="hint">Used by the hero button and the closing button both.</p>');

  h += sec('media', 'Background', dirtyAny(['mediaMode','mediaPoster']),
    '<div class="ctl"><label>Mode</label><select data-k="mediaMode"' + (v.locked ? ' disabled' : '') + '>' +
      [['video','Video loop'],['image','Still image']].map(([val, lab]) =>
        '<option value="' + val + '"' + (mergedActive().mediaMode === val ? ' selected' : '') + '>' + lab + '</option>').join('') +
      '</select></div>' +
    textRow('mediaPoster', 'Image / poster', { hint: 'A path under /assets — e.g. /assets/fpl-38-.png' }));

  h += sec('sizing', 'Sizing', dirtyAny(['hlSize','hlLineHeight','hlTracking','statSize','minHeight','overlayTop','overlayBottom']),
    sliderRow('hlSize', 'Headline size', 6, 20, 0.25, 'vw') +
    sliderRow('hlLineHeight', 'Headline line-height', 0.7, 1.2, 0.01, '') +
    sliderRow('hlTracking', 'Headline tracking', -0.06, 0.02, 0.002, 'em') +
    sliderRow('statSize', 'Proof-line size', 12, 22, 0.5, 'px') +
    sliderRow('minHeight', 'Hero height', 50, 100, 1, 'vh') +
    sliderRow('overlayTop', 'Dim — top', 0, 90, 1, '%') +
    sliderRow('overlayBottom', 'Dim — bottom', 0, 95, 1, '%'));

  if (!v.locked) {
    h += sec('offer', 'The offer', dirtyAny(['offerEyebrow','offerHeading','offerBody','price','priceNote','includes']),
      textRow('offerEyebrow', 'Section label') +
      textRow('offerHeading', 'Heading', { area: true, rows: 2, rich: true, hint: 'A line break here is a line break on the page.' }) +
      textRow('offerBody', 'Body', { area: true, rows: 4, rich: true, count: true }) +
      textRow('price', 'Price', { ph: '$500', hint: 'Leave empty and the whole price block disappears.' }) +
      textRow('priceNote', 'Price note') +
      listRows('includes', "What's included", 'text'));

    h += sec('showcase', 'Showcase', dirtyAny(['showcaseEyebrow','showcase']),
      textRow('showcaseEyebrow', 'Section label') +
      listRows('showcase', 'Projects', 'project',
        { hint: 'Pulled from src/data/projects.ts. Empty hides the section; two columns, so even counts look best.' }));

    h += sec('close', 'Closing line', dirty('finalCtaText'),
      textRow('finalCtaText', 'Closing line', { rich: true, count: true }));
  }

  $('pbody').innerHTML = h;
  wirePanel();
  measureGuardrails();
}

function wirePanel() {
  document.querySelectorAll('.sec').forEach((d) => d.addEventListener('toggle', () => (secOpen[d.dataset.sec] = d.open)));

  document.querySelectorAll('[data-k]').forEach((inp) => {
    inp.addEventListener('input', () => {
      arm();
      onField(inp.dataset.k, inp.value);
      const cnt = $('cnt-' + inp.dataset.k);
      if (cnt) cnt.textContent = plain(inp.value).length;
    });
    inp.addEventListener('change', () => {
      commit();
      if (['name','slug'].includes(inp.dataset.k)) { renderPills(); renderPanel(); }
    });
  });

  document.querySelectorAll('[data-check]').forEach((box) => {
    box.addEventListener('change', () => { arm(); active()[box.dataset.check] = box.checked; commit(); });
  });

  document.querySelectorAll('.fmt[data-fmt]').forEach((b) => {
    b.addEventListener('mousedown', (e) => e.preventDefault()); // keep the selection
    b.addEventListener('click', () => toggleFmt(b.dataset.for, b.dataset.fmt));
  });

  document.querySelectorAll('[data-slider]').forEach((sl) => {
    sl.addEventListener('input', () => {
      arm();
      setField(sl.dataset.slider, Number(sl.value));
      const el = $('val-' + sl.dataset.slider);
      if (el) el.textContent = sl.value;
      applyToFrame();
    });
    sl.addEventListener('change', () => { commit(); renderPanel(); });
  });

  document.querySelectorAll('[data-clear]').forEach((b) => b.addEventListener('click', () => {
    arm(); setField(b.dataset.clear, null); commit(); applyToFrame(); renderPanel();
  }));

  document.querySelectorAll('[data-list]').forEach((inp) => {
    inp.addEventListener('input', () => { arm(); onListField(inp.dataset.list, Number(inp.dataset.i), inp.dataset.sub, inp.value); });
    inp.addEventListener('change', () => { arm(); onListField(inp.dataset.list, Number(inp.dataset.i), inp.dataset.sub, inp.value); commit(); });
  });

  document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => {
    const key = b.dataset.add;
    arm();
    const rows = clone(mergedActive()[key] || []);
    rows.push(key === 'listItems' ? { label: 'New row', number: String(rows.length + 1).padStart(2, '0'), href: '' }
      : key === 'showcase' ? (meta.projects[0] || '') : 'New line');
    setField(key, rows); commit(); applyToFrame(); renderPanel();
  }));

  document.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
    arm();
    const rows = clone(mergedActive()[b.dataset.del] || []);
    rows.splice(Number(b.dataset.i), 1);
    setField(b.dataset.del, rows); commit(); applyToFrame(); renderPanel();
  }));
}

/** Store a value with the delta rule: anything equal to the home baseline is
 *  stored as null, so a page only carries what it actually changes. */
function setField(key, value) {
  const v = active();
  if (!v || v.locked) return;
  if (value === null) { v[key] = null; return; }
  const base = baseline[key];
  const same = typeof base === 'string' ? norm(value) === norm(base)
    : base && typeof base === 'object' ? JSON.stringify(value) === JSON.stringify(base)
    : value === base;
  v[key] = same ? null : value;
}

function onField(key, value) {
  const v = active();
  if (!v) return;
  if (key === 'name') {
    if (v.locked) return;
    v.name = value;
    if (v.slugAuto !== false) v.slug = kebab(value);
    $('ptitle').textContent = value;
    return;
  }
  if (key === 'slug') { v.slug = kebab(value); v.slugAuto = false; return; }
  if (['description', 'title', 'metaDescription'].includes(key)) { v[key] = value; return; }
  if (v.locked) return;
  setField(key, value);
  applyToFrame();
}

function onListField(key, i, sub, value) {
  const v = active();
  if (!v || v.locked) return;
  const rows = clone(mergedActive()[key] || []);
  if (!rows[i] && rows[i] !== '') return;
  if (sub) rows[i][sub] = value; else rows[i] = value;
  setField(key, rows);
  applyToFrame();
}

/** Wrap/unwrap the selection in a copy marker. */
function toggleFmt(key, marker) {
  const inp = document.querySelector('[data-k="' + key + '"]');
  if (!inp) return;
  const s = inp.selectionStart, e = inp.selectionEnd;
  if (s == null || s === e) { toast('Select the words to format first'); return; }
  const val = inp.value, selected = val.slice(s, e), L = marker.length;
  let next, ns = s, ne = e;
  if (val.slice(s - L, s) === marker && val.slice(e, e + L) === marker) {
    next = val.slice(0, s - L) + selected + val.slice(e + L); ns = s - L; ne = e - L;
  } else if (selected.startsWith(marker) && selected.endsWith(marker) && selected.length >= 2 * L) {
    next = val.slice(0, s) + selected.slice(L, -L) + val.slice(e); ne = e - 2 * L;
  } else {
    next = val.slice(0, s) + marker + selected + marker + val.slice(e); ns = s + L; ne = e + L;
  }
  inp.value = next;
  inp.focus(); inp.setSelectionRange(ns, ne);
  arm(); onField(key, next); commit();
  const cnt = $('cnt-' + key);
  if (cnt) cnt.textContent = plain(next).length;
}

/* ══ Undo ════════════════════════════════════════════════════ */
function arm() { if (!undoArmed) undoArmed = JSON.stringify(state.variants); }
function commit() {
  if (undoArmed && undoArmed !== JSON.stringify(state.variants)) {
    undoStack.push(undoArmed);
    if (undoStack.length > 60) undoStack.shift();
  }
  undoArmed = null;
}
function undo() {
  if (!undoStack.length) { toast('Nothing to undo'); return; }
  state.variants = JSON.parse(undoStack.pop());
  if (!active()) state.activeId = state.variants[0].id;
  applyToFrame(); renderPills(); renderPanel(); toast('Undone');
}

/* ══ Footer actions ══════════════════════════════════════════ */
async function save(opts) {
  opts = opts || {};
  try {
    const res = await fetch('/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'save failed');
    meta.pages = json.pages;
    if (!opts.quiet) toast('Saved — ' + json.pages.length + ' page(s) built');
    return true;
  } catch (e) {
    toast('⚠ Save failed: ' + e.message);
    return false;
  }
}

$('undob').onclick = undo;
$('resetb').onclick = () => {
  const v = active();
  if (!v || v.locked) { toast('The home page is the baseline'); return; }
  if (!confirm('Reset every field on “' + v.name + '” back to the home-page baseline?')) return;
  arm();
  EDIT_KEYS.forEach((k) => (v[k] = null));
  commit();
  applyToFrame(); renderPanel(); toast('Reset to baseline');
};
$('copyb').onclick = async () => {
  const v = active();
  if (!v) return;
  const copy = { ...v };
  delete copy.slugAuto;
  await navigator.clipboard.writeText(JSON.stringify(copy, null, 2));
  toast('Page JSON copied');
};
$('saveb').onclick = async () => {
  const before = targetUrl(active());
  if (!(await save())) return;
  renderPanel();
  if (targetUrl(active()) !== before) loadFrame();
  else frame.contentWindow.location.reload();
};
$('shotb').onclick = async () => {
  const v = active();
  if (!v) return;
  toast('Rendering…');
  if (!(await save({ quiet: true }))) return;
  try {
    const res = await fetch('/shot?variant=' + v.id + '&w=' + $('fw').value + '&h=' + $('fh').value);
    if (!res.ok) throw new Error(await res.text());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await res.blob());
    a.download = 'hero-' + v.id + '.png';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('📸 Saved to hero-lab/exports/');
  } catch (e) {
    toast('⚠ ' + String(e.message).slice(0, 90));
  }
};

/* ══ Stage controls ══════════════════════════════════════════ */
function setFrame(w, h) {
  document.documentElement.style.setProperty('--frame-w', w + 'px');
  document.documentElement.style.setProperty('--frame-h', h + 'px');
  $('fw').value = w;
  $('fh').value = h;
  document.body.classList.toggle('phone', w <= 500);
  fitFrame();
}
function fitFrame() {
  const w = Number($('fw').value) || 1440;
  const avail = $('stage').clientWidth - 48;
  const scale = Math.min(1, avail / w);
  document.documentElement.style.setProperty('--frame-scale', String(scale));
  const fold = $('foldline');
  fold.style.top = (Number($('fh').value) || 900) * scale + 'px';
  requestAnimationFrame(measureGuardrails);
}
$('devsel').onchange = () => {
  const val = $('devsel').value;
  if (val === 'custom') return;
  const [w, h] = val.split('x').map(Number);
  setFrame(w, h);
};
['fw', 'fh'].forEach((id) => ($(id).oninput = () => {
  $('devsel').value = 'custom';
  setFrame(Number($('fw').value) || 1440, Number($('fh').value) || 900);
}));
$('foldck').onchange = () => $('foldline').classList.toggle('show', $('foldck').checked);
$('reloadb').onclick = () => loadFrame();
window.addEventListener('resize', fitFrame);

/* hold to see the home baseline */
function flipDown() { if (baseline) { $('flip').classList.add('holding'); applyToFrame({ ...baseline }); } }
function flipUp() { $('flip').classList.remove('holding'); applyToFrame(); }
$('flip').addEventListener('mousedown', flipDown);
['mouseup', 'mouseleave'].forEach((ev) => $('flip').addEventListener(ev, flipUp));
document.addEventListener('keydown', (e) => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.code === 'Space' && !inField && !e.repeat) { e.preventDefault(); flipDown(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !inField) { e.preventDefault(); undo(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); $('saveb').click(); }
});
document.addEventListener('keyup', (e) => { if (e.code === 'Space') flipUp(); });

/* ══ Compare ═════════════════════════════════════════════════ */
$('cmpbtn').onclick = () => {
  const on = document.body.classList.toggle('compare');
  $('cmpbtn').classList.toggle('on', on);
  const cmp = $('cmp');
  cmp.innerHTML = '';
  if (!on) return;
  state.variants.forEach((v) => {
    const cell = document.createElement('div');
    cell.innerHTML = '<div class="cmp-head"><span class="id">' + esc(v.id.toUpperCase()) + '</span>' +
      '<span>' + esc(v.name) + '</span>' + (v.locked ? ' 🔒' : '') + '</div>';
    const wrap = document.createElement('div');
    wrap.className = 'cmp-frame';
    const f = document.createElement('iframe');
    f.src = targetUrl(v);
    f.title = 'page ' + v.id;
    f.addEventListener('load', () => {
      const doc = f.contentDocument;
      if (doc && doc.querySelector('[data-fpl-hero]')) FplHeroLab.apply(doc, FplHeroLab.merged(v, baseline), baseline);
    });
    wrap.appendChild(f);
    cell.appendChild(wrap);
    cmp.appendChild(cell);
  });
};

/* ══ Misc ════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
Object.defineProperty(window, '__lab', { get: () => ({ state, baseline, meta, defaults }) });

boot();
